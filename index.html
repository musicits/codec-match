      <h1>블루투스 코덱 호환 확인</h1>
      <p>스마트폰과 이어폰·헤드폰을 선택하면 두 기기가 공통으로 지원하는 블루투스 코덱 중 실제 적용될 것으로 예상되는 코덱을 알려주는 도구입니다. 갤럭시·아이폰·구글 픽셀·샤오미·엑스페리아·낫싱·LG 스마트폰과 갤럭시 버즈, 에어팟, 소니 1000X 시리즈, 보스, 젠하이저, JBL, 낫싱, 비츠, 앤커 사운드코어, 테크닉스, LG 톤프리, 자브라, 마샬, 뱅앤올룹슨, AKG, 슈어, 파이널, 데논, QCY, 이어펀을 지원하며 SBC, AAC, aptX, aptX HD, aptX Adaptive, LDAC, LHDC, 삼성 SSC(Scalable / Hi-Fi / UHQ), LC3를 다룹니다. 이용하려면 자바스크립트를 켜주세요.</p>
    
      <h2>자주 찾는 조합</h2><ul><li>갤럭시 S26 울트라 + 갤럭시 버즈4 프로: SSC-UHQ, 24bit 96kHz</li><li>갤럭시 S26 울트라 + 에어팟 프로 3: AAC, 최대 약 250 kbps</li><li>갤럭시 S26 울트라 + 소니 WF-1000XM6: LDAC, 최대 990 kbps</li><li>갤럭시 S26 울트라 + 보스 QC 울트라 이어버드 2세대: aptX, 최대 352 kbps</li><li>아이폰 17 프로 + 갤럭시 버즈4 프로: AAC, 최대 약 250 kbps</li><li>아이폰 17 프로 + 에어팟 프로 3: AAC, 최대 약 250 kbps</li><li>아이폰 17 프로 + 소니 WF-1000XM6: AAC, 최대 약 250 kbps</li><li>아이폰 17 프로 + 보스 QC 울트라 이어버드 2세대: AAC, 최대 약 250 kbps</li><li>픽셀 11 + 갤럭시 버즈4 프로: AAC, 최대 약 250 kbps</li><li>픽셀 11 + 에어팟 프로 3: AAC, 최대 약 250 kbps</li><li>픽셀 11 + 소니 WF-1000XM6: LDAC, 최대 990 kbps</li><li>픽셀 11 + 보스 QC 울트라 이어버드 2세대: aptX, 최대 352 kbps</li><li>샤오미 17 + 갤럭시 버즈4 프로: AAC, 최대 약 250 kbps</li><li>샤오미 17 + 에어팟 프로 3: AAC, 최대 약 250 kbps</li><li>샤오미 17 + 소니 WF-1000XM6: LDAC, 최대 990 kbps</li><li>샤오미 17 + 보스 QC 울트라 이어버드 2세대: aptX Adaptive, 279–420 kbps 가변</li></ul><h2>자주 묻는 질문</h2><h3>아이폰에서도 LDAC이 되나요?</h3><p>안 됩니다. 아이폰은 SBC와 AAC만 씁니다. 소니 WF-1000XM6처럼 LDAC을 지원하는 이어폰도 아이폰에서는 AAC(최대 약 250 kbps)로 연결됩니다.</p><h3>갤럭시 S26 울트라에 소니 WF-1000XM6를 쓰면 어떤 코덱인가요?</h3><p>LDAC로 연결됩니다. 최대 990 kbps, 지연은 약 180–250 ms입니다.</p><h3>갤럭시 버즈4 프로를 갤럭시에 쓰면 어떤 코덱인가요?</h3><p>삼성 전용 SSC로 연결되고, 최대 SSC-UHQ(24bit 96kHz)까지 올라갑니다(One UI 6.1.1 이상, 갤럭시 웨어러블 &gt; 고급 음질에서 켜야 적용).</p>
